[project]
name = "ace-indexer"
version = "0.4.0"
description = "Antigravity Context Engine (ACE) - Local Codebase Indexer & Semantic Search"
authors = [
    { name = "Julian", email = "julian@example.com" }
]
dependencies = [
    "mcp",
    "tree-sitter",
    "tree-sitter-python",
    "chromadb"
]
requires-python = ">=3.10"

[project.scripts]
ace = "main_stdio:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
